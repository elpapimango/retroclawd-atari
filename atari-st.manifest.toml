# P01 (Phase 3 timing probes, machines/atari/timing/): the harness smoke test. The probe floppy boots through a shared
# stub (stub.s), writes 16 bytes at $C000 and loops; the golden is Hatari 2.6.1's dump of the same memory
# (retroclawd-tools/scripts/capture_hatari_mem.py ... 600 0xC000 16): the same bytes, exactly. Later probes (P02-P20)
# compare timing the same way; docs/timing-oracle.md.
[[scenario]]
id = "P01"
kind = "memory"
frames = 600
files = { disk = "atari/software/scenarios/timing/p01.st" }
start = 49152
len = 16
golden = "atari-st/timing/p01.bin"
golden_sha256 = "2540ccda0a84c47dd18883dbb4cf499d3f604ac69f9ec15c8fe9949ecba868fd"
compare = { mode = "exact" }

# P02: how long 48 instruction forms take on the ST, wait states included (timing/gen_p02.py). One frame a form: a loop of
# four copies runs while the HBL handler stores, for the first 64 lines after the VBL, how many times it ran since the last
# HBL. Hatari's dump is the golden. The mean counts agree to 0.035 (tests/timing_probes.rs, p02_instruction_timing_agrees_
# with_hatari_on_the_mean) but the sequences do not: see the gap.
[[scenario]]
id = "P02"
kind = "memory"
frames = 1200
args = ["--accuracy", "accurate"]
files = { disk = "atari/software/scenarios/timing/p02.st" }
start = 49152
len = 6148
golden = "atari-st/timing/p02.bin"
golden_sha256 = "7d7d209a6fdd439706781bed68b387e940743064b063228f32169edf37876a23"
compare = { mode = "exact" }
status = "known-gap"
gap = { reason = "the line-by-line counts differ from Hatari's by one run on about a third of the lines: where inside an instruction an interrupt is taken, and the clocks of its acknowledge, are modelled to the nearest few clocks only", evidence = "per-variant mean difference at most 0.035 runs a line (2 runs in 58); the exact sequences differ (RC_SHOW=<variant> cargo test --release -p atari-st --test timing_probes p02_report -- --ignored --nocapture); model fitted in a small simulation: the 4 and 12-clock loops fit exactly, the 8-clock ones to within 4 runs in 61" }

# P04: the video address counter ($FF8205/07/09) read at 128 points along a line, on five lines of the frame
# (timing/p04_video_counter.s). Hatari's dump is the golden. Border lines agree exactly; inside the picture the counter agrees
# to one word (tests/timing_probes.rs, p04_video_counter_agrees_with_hatari).
[[scenario]]
id = "P04"
kind = "memory"
frames = 700
args = ["--accuracy", "accurate"]
files = { disk = "atari/software/scenarios/timing/p04.st" }
start = 49152
len = 4004
golden = "atari-st/timing/p04.bin"
golden_sha256 = "ae3e92a52a27f7067920a32e2fcbfd9af867f5a8466107466a978c6053927733"
compare = { mode = "exact" }
status = "known-gap"
gap = { reason = "inside the picture Hatari's counter differs from ours by one word on about half of the samples: the reads of the three counter bytes take clock-exact slots that the model of the wait states does not reproduce, and the interrupt that starts the sample is placed to a few clocks only", evidence = "sum of the absolute differences 94 bytes over 128 samples a line (RC_SHOW=1 cargo test --release -p atari-st --test timing_probes p04_report -- --ignored --nocapture)" }

# P06: the MFP timer A data register against the time since the control register started the timer (timing/p06_mfp_timer.s): four
# prescalers, 64 starting points each. Hatari's dump is the golden: all but two reads equal, two off by one.
[[scenario]]
id = "P06"
kind = "memory"
frames = 700
args = ["--accuracy", "accurate"]
files = { disk = "atari/software/scenarios/timing/p06.st" }
start = 49152
len = 260
golden = "atari-st/timing/p06.bin"
golden_sha256 = "3cc16ecb34395c87a8d14b1202d225e722086aa9822f4c6c231a50482378c68d"
compare = { mode = "exact" }
status = "known-gap"
gap = { reason = "two of the 256 timer reads differ from Hatari's by one count: the timer's first count after the control write is placed to the clock in Hatari and to the nearest MFP tick here", evidence = "ours-minus-theirs over the 256 reads has two entries of 1 and none else (cargo test --release -p atari-st --test timing_probes p06_report -- --ignored --nocapture)" }

# S12 (probe P07, timing/p07_palette_strip.s): on 64 lines the HBL handler writes palette entry 1 red part way along the line and
# white again 100 clocks later, a red strip on each line that starts one clock later than the line above. Hatari 2.6.1's picture is the
# golden; measured by hand (a PNG reader): all 122 rows of red start and end on exactly the same pixel as ours. The similarity limit is
# for its grey levels, not for the strips.
[[scenario]]
id = "S12"
kind = "screen"
frames = 700
args = ["--accuracy", "accurate"]
files = { disk = "atari/software/scenarios/timing/p07.st" }
golden = "atari-st/S12-palette-strips.png"
golden_sha256 = "647134a3830d0468e1fa54e89efa7b24bd31eec7fadc29738d9c7f38cc9fee00"
compare = { mode = "similarity", max_mad = 1.0, normalize = true, reason = "another emulator's picture: its colour shades differ from ours; the strips themselves start and end on the same pixels on all 122 rows" }

# S13 (probe P07 with the borders): Hatari 2.6.1 with --borders on draws the 832x552 canvas; ours with borders=on. Same strips as S12, now
# also in the border colour; the 640x400 picture sits at (96, 58) in both. Similarity for the grey levels only.
[[scenario]]
id = "S13"
kind = "screen"
frames = 700
args = ["--accuracy", "accurate", "--borders", "on"]
files = { disk = "atari/software/scenarios/timing/p07.st" }
golden = "atari-st/S13-borders.png"
golden_sha256 = "f78ae0d58627ae93fc7f23ed34448301898fd1570116204a96fed8851cc1b951"
compare = { mode = "similarity", max_mad = 1.0, normalize = true, reason = "another emulator's picture: its colour shades differ from ours; the picture and the border sit on the same pixels" }

# S15: the EmuTOS desktop on the monochrome monitor after 1500 frames (probe P14 and P15 give its frame: 501 lines of 224 clocks, the
# picture on lines 34 to 433). Hatari 2.6.1 with --monitor mono draws the same 640x400 picture.
[[scenario]]
id = "S15"
kind = "screen"
frames = 1500
args = ["--monitor", "mono"]
golden = "atari-st/S15-mono-desktop.png"
golden_sha256 = "df6f0b0f3d9fdc7893ca94a8fa9ee28e56076810591e0c1c00f478d0e264dd27"
compare = { mode = "similarity", max_mad = 2.0, normalize = true, crop = [0.0, 0.0, 0.45, 1.0], reason = "another emulator's picture; the crop leaves out the mouse pointer, which Hatari draws at its own start position" }

# P14 (timing/p14_mono_frame.s): the mono frame, ten loop counts with the HBL masked and eleven HBL counts.
[[scenario]]
id = "P14"
kind = "memory"
frames = 700
args = ["--monitor", "mono", "--accuracy", "accurate"]
files = { disk = "atari/software/scenarios/timing/p14.st" }
start = 49152
len = 66
golden = "atari-st/timing/p14.bin"
golden_sha256 = "d50216e0ec2d26066880ddbdb85d0662dedb425a1e110f4885f8397d9f361c96"
compare = { mode = "exact" }
status = "known-gap"
