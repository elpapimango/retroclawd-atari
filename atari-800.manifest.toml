machine = "atari-800"
# Only explicitly identified Altirra replacement ROMs are verified.
# See docs/atari800-gaps.md for reference capture, limits and missing acceptance.

[reference]
emulator = "Atari800"
version = "7.2.1 Win64, source 63a381884175e3cbfc745ff00dfb3d70d928eb50; Altirra Hardware Reference 2026-01-02 for POKEY divisors and raster counts"
command = "python capture_atari800_screen.py OS OUT --basic BASIC --atari800 atari800.exe --region pal|ntsc --frames 300; private config, explicit ROMs, -nopatchall, alternating BLINE 156/0 and native F10 screenshot; S3 adds --program atari800-program.bin --org 0x2000 --frames 5 --memory 0x4000:256 --memory-out S3-program.bin"

[files]
rom-os = "atari/roms/atari800/altirraos_800.rom"
rom-basic = "atari/roms/atari800/altirra_basic.rom"

[[scenario]]
id = "S1"
kind = "screen"
frames = 300
golden = "atari-800/S1-pal.png"
golden_sha256 = "5ebcc2676340d4cc8e19fda2fd4fdf3f927ca5aafb6b8118331d2175358a5081"
compare = { mode = "similarity", max_mad = 0.01, normalize = true, crop = [0.08333333333333333, 0.1, 0.9166666666666666, 0.16666666666666666], golden_crop = [0.023809523809523808, 0.1, 0.9761904761904762, 0.16666666666666666], reason = "Compare all 320x16 pixels containing the stable replacement BASIC banner and Ready prompt; the next row is a blinking cursor. Remove only border geometry and palette differences, not glyph differences. Full video fidelity remains experimental." }

[[scenario]]
id = "S1-accurate"
kind = "screen"
frames = 300
args = ["--execution-mode", "accurate"]
golden = "atari-800/S1-pal.png"
golden_sha256 = "5ebcc2676340d4cc8e19fda2fd4fdf3f927ca5aafb6b8118331d2175358a5081"
compare = { mode = "similarity", max_mad = 0.01, normalize = true, crop = [0.08333333333333333, 0.1, 0.9166666666666666, 0.16666666666666666], golden_crop = [0.023809523809523808, 0.1, 0.9761904761904762, 0.16666666666666666], reason = "Stable 320x16 banner and Ready prompt, excluding the following blinking-cursor row; normalize palette and border only." }

