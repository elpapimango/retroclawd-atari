machine = "atari-800"
# Only explicitly identified Altirra replacement ROMs are verified.
# See docs/atari800-gaps.md for reference capture, limits and missing acceptance.

[reference]
emulator = "Atari800"
version = "7.2.1 Win64, source 63a381884175e3cbfc745ff00dfb3d70d928eb50; Altirra Hardware Reference 2026-01-02 for POKEY divisors and raster counts"
command = "python capture_atari800_screen.py OS OUT --basic BASIC --atari800 atari800.exe --region pal|ntsc --frames 300; private config, explicit ROMs, -nopatchall, alternating BLINE 156/0 and native F10 screenshot; S3 adds --program atari800-program.bin --org 0x2000 --frames 5 --memory 0x4000:256 --memory-out S3-program.bin"

[files]
rom-os = "atari/roms/atari800/altirraos_800.rom"
rom-basic = "atari/roms/atari800/altirra_basic.rom"

