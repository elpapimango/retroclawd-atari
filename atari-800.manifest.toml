# Altirra Hardware Reference 5.4: pure tone = CPU / (2 * 28 * (AUDF + 1)).
# The test Program sets AUDF1=150, AUDC1=$AF, AUDCTL=0, SKCTL=3.
# Tone gates do not establish reference RMS or analogue mixer calibration.
[[scenario]]
id = "S4"
kind = "audio"
frames = 150
files = { program = "atari/software/scenarios/atari800-program.bin" }
args = ["--org", "0x2000"]
audio = { from_s = 0.5, to_s = 2.0, tone_hz = 209.7265, tone_tolerance_pct = 0.5, min_amplitude = 0.01 }

