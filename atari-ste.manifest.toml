len = 340
golden = "atari-ste/timing/p30.bin"
golden_sha256 = "dcfca2634610563ab90b303bbe4201d829a40dea39098f263db5fea02ca21409"
compare = { mode = "exact" }
status = "known-gap"
gap = { reason = "the first two reads and the end match; between them Hatari shifts 4, 3, 3, 3 bits a read in the tightest loop where the hardware shifts one bit in 8 clocks", evidence = "timing_probes p30_the_microwire_data_register_shifts_out_as_in_hatari" }


# S18: ste_tone.bin (--program at $8000, scenarios/ste_tone.s) loops a 32-frame stereo buffer by DMA at 50066 Hz: the left channel
# a square wave of 50066 / 32 = 1564.6 Hz (+-64), the right channel silent. The fundamental of a +-0.5 square is 0.64.
[[scenario]]
id = "S18"
kind = "audio"
frames = 300
args = ["--org", "0x8000"]
files = { program = "atari/software/scenarios/ste_tone.bin" }
audio = { from_s = 1.0, to_s = 5.0, tone_hz = 1564.6, tone_tolerance_pct = 1.0, min_amplitude = 0.4, channel = 0, other_channel_below_rms = 0.001 }

# S19: a picture made by the Blitter: a halftone fill (HOP 1) of plane 0, a skewed copy with FXSR and end masks to plane 1, an XOR of halftone and source with NFSR to plane 2 (timing/p42_blit_picture.s). Hatari 2.6.1 draws the same picture pixel for pixel.
[[scenario]]
id = "S19"
kind = "screen"
frames = 700
files = { disk = "atari/software/scenarios/timing/p42.st" }
