# P29: the DMA sound's registers and counter.
[[scenario]]
id = "P29"
kind = "memory"
frames = 1500
args = ["--accuracy", "accurate"]
files = { disk = "atari/software/scenarios/timing/p29.st" }
start = 49152
len = 2165
golden = "atari-ste/timing/p29.bin"
golden_sha256 = "2407bc9e6eee9a754489c4853cbcbec5c2f7b4840b2507922f52e47191b77278"
compare = { mode = "exact" }
status = "known-gap"
gap = { reason = "the control, GPIP, timer A and stop records are exact; the counter register differs by up to 16 bytes: Hatari moves it in lumps at scan lines with a per-rate start-up ramp, ours is the bytes fetched ahead of the sample played", evidence = "timing_probes p29_the_dma_sound_registers_and_counter_move_as_in_hatari (counter within 16 bytes)" }

# P41: the DMA sound's byte rate over 6 million clocks.
[[scenario]]
id = "P41"
kind = "memory"
frames = 600
args = ["--accuracy", "accurate"]
files = { disk = "atari/software/scenarios/timing/p41.st" }
start = 49152
len = 24
golden = "atari-ste/timing/p41.bin"
golden_sha256 = "c99935a196415de0a95f8cda57cf1a84b1003448422b2e191ca8ce0e94e40609"
compare = { mode = "exact" }
status = "known-gap"
gap = { reason = "the counters agree to 16 bytes in 40000 (the rate matches; the lumpiness of Hatari's counter is the difference)", evidence = "timing_probes p41_the_dma_sound_plays_bytes_at_hatari_s_rate_over_a_long_run" }

# P34: a counted loop's iterations while six blits run.
[[scenario]]
id = "P34"
kind = "memory"
frames = 700
args = ["--accuracy", "accurate"]
files = { disk = "atari/software/scenarios/timing/p34.st" }
start = 49152
len = 844
golden = "atari-ste/timing/p34.bin"
golden_sha256 = "37c9b4a3febb009550cf650eb419548da2b2c3dfa96840ceefdaf67f0172acd9"
compare = { mode = "exact" }
status = "known-gap"
gap = { reason = "the loop counts differ by up to 6 iterations of about 6669 a frame (0.1%): the CPU's slice between two Blitter bursts ends on an instruction boundary in both, at slightly different places; the busy frames, control byte and GPIP are equal in all 105 records", evidence = "timing_probes p34_a_running_blitter_costs_the_cpu_what_it_does_in_hatari_accurate" }

# P30: the Microwire data register's shift.
[[scenario]]
id = "P30"
