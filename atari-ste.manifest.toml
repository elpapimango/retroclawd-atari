machine = "atari-ste"
# EmuTOS 1.4 (256 KB UK) from `--firmware auto` (firmware.toml, by hash). The probe media come from timing/build.sh
# (software/scenarios/timing/, not committed); goldens are Hatari 2.6.1 `--machine ste` dumps (never committed).
args = ["--firmware", "auto"]

[reference]
emulator = "hatari"
version = "2.6.1"
command = "retroclawd-tools/scripts/capture_hatari_mem.py ROM FLOPPY VBLS ADDR LEN OUT --machine ste; capture_hatari_screen.py --machine ste"

# S16: the EmuTOS STE desktop after 1500 frames: the Blitter draws the menu text and the pointer; pixel for pixel Hatari's picture.
[[scenario]]
id = "S16"
kind = "screen"
frames = 1500
golden = "atari-ste/S16-desktop.png"
golden_sha256 = "9f8733f50237c2157b91cf9ef1f5d645fd641f219e214980a5391b182a897a84"
compare = { mode = "exact" }

