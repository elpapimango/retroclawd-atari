[package]
name = "st-floppy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Atari ST .st floppy images: geometry, sectors, MFM tracks for a WD1772"

[dev-dependencies]
bincode = { version = "2", features = ["serde"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
wd1770 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "0777d5e2366e97832f4554acc6e7c2d6e6a9d6ac" }

