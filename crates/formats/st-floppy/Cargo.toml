[package]
name = "st-floppy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Atari ST .st floppy images: geometry, sectors, MFM tracks for a WD1772"

[dev-dependencies]
bincode = { version = "2", features = ["serde"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
wd1770 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "fc671b33c050ebf6a8fed5e29aad9cae0d39c0a6" }

