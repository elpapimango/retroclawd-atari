[package]
name = "atari-8bit-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "atari_8bit_machine_plugin_impl"

[dependencies]
atari-8bit = { path = "../../machines/atari-8bit" }
gtia = { path = "../../chips/gtia" }
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "b5375a3c5477ad4e485eaf78da6fbf19e7292a4b" }
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "b5375a3c5477ad4e485eaf78da6fbf19e7292a4b" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "b5375a3c5477ad4e485eaf78da6fbf19e7292a4b" }
build-info = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "b5375a3c5477ad4e485eaf78da6fbf19e7292a4b" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }

[build-dependencies]
build-info = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "b5375a3c5477ad4e485eaf78da6fbf19e7292a4b" }
