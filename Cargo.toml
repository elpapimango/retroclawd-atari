[workspace]
resolver = "2"
members = ["crates/chips/ikbd", "crates/formats/st-floppy", "crates/chips/mc68901", "crates/chips/st-shifter", "crates/chips/blitter", "crates/machines/atari-st", "crates/plugins/atari-st-machine-plugin", "crates/plugin-dlls/atari-st", "crates/chips/antic", "crates/chips/gtia", "crates/chips/pokey", "crates/machines/atari-8bit", "crates/plugins/atari-8bit-machine-plugin", "crates/plugin-dlls/atari-8bit", "crates/formats/atari-media"]

# Same release profile as the retroclawd host.
[profile.release]
strip = true
opt-level = "s"

[profile.profiling]
inherits = "release"
debug = true

[profile.release.package.mc68000]
opt-level = 3

[profile.release.package.machine]
opt-level = 3

[profile.release.package.atari-8bit]
opt-level = 3

[profile.release.package.antic]
opt-level = 3

[profile.release.package.gtia]
opt-level = 3

[profile.release.package.pokey]
opt-level = 3

[profile.release.package.atari-media]
opt-level = 3

[profile.release.package.atari-st]
opt-level = 3

[profile.release.package.st-shifter]
opt-level = 3

[profile.release.package.mc68901]
opt-level = 3

[profile.release.package.ikbd]
opt-level = 3

[profile.release.package.wd1770]
opt-level = 3

[profile.release.package.mc6850]
opt-level = 3

[profile.release.package.ay-3-8910]
opt-level = 3

[profile.release.package.atari-st-machine-plugin]
strip = false

[profile.release.package.atari-st-machine-plugin-dll]
strip = false
