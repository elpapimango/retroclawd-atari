[workspace]
resolver = "2"
members = ["crates/chips/mc68901", "crates/chips/st-shifter", "crates/machines/atari-st", "crates/plugins/atari-st-machine-plugin", "crates/plugin-dlls/atari-st"]

# Same release profile as the retroclawd host.
[profile.release]
strip = true
opt-level = "s"

[profile.profiling]
inherits = "release"
debug = true

[profile.release.package.mc68000]
opt-level = 3

[profile.release.package.machine]
opt-level = 3

[profile.release.package.atari-st-machine-plugin]
strip = false

[profile.release.package.atari-st-machine-plugin-dll]
strip = false
